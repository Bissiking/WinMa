# .github/workflows/ci.yml
# Intégration continue : audit, tests SQLite + PostgreSQL et recette
# navigateur (Chromium système, Firefox et WebKit via Playwright).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (SQLite + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test

  tests-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: winma
          POSTGRES_PASSWORD: winma_test
          POSTGRES_DB: winma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://winma:winma_test@127.0.0.1:5432/winma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Recette navigateur (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      LUMA_E2E_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium utilise le Chrome préinstallé du runner ; Firefox et WebKit
      # sont installés via Playwright avec leurs dépendances système.
      - if: matrix.engine != 'chromium'
        run: npx playwright-core install --with-deps ${{ matrix.engine }}
      - run: npm run test:e2e
