<!doctype html>
<html lang="fr" data-theme="luma">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d1532">
    <title>Luma OS</title>
    <link rel="icon" type="image/png" href="./images/favicon/logo-luma.png">
    <link rel="stylesheet" href="./assets/css/luma-shell.css">
    <link rel="stylesheet" href="./apps/session-select/style.css">
    <link rel="stylesheet" href="./apps/parametres/style.css">
    <link rel="stylesheet" href="./apps/documents/style.css">
    <link rel="stylesheet" href="./apps/web-frame/style.css">
</head>
<body>
    <!-- Direction contract: LUMA Fluent is calm, luminous and precise; one original desktop system supports overlapping, focused and snapped windows across Clair, Sombre and Luma themes. -->
    <svg class="icon-sprite" aria-hidden="true">
        <symbol id="icon-luma" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7.5h7l2-2h9v14H3z"/><path d="M3 10h18"/></symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 3h6l1 4H8zM6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2.1-.7a7 7 0 0 0-.8-1.8l1-2-2.1-2.1-2 1a7 7 0 0 0-1.8-.8L10.5 2h-3l-.7 2.1A7 7 0 0 0 5 4.9l-2-1L.9 6l1 2a7 7 0 0 0-.8 1.8L-1 10.5v3l2.1.7A7 7 0 0 0 2 16l-1 2 2.1 2.1 2-1a7 7 0 0 0 1.8.8l.7 2.1h3l.7-2.1a7 7 0 0 0 1.8-.8l2 1 2.1-2.1-1-2a7 7 0 0 0 .8-1.8z" transform="translate(2) scale(.84)"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
        <symbol id="icon-power" viewBox="0 0 24 24"><path d="M12 2v9M6.3 5.8a9 9 0 1 0 11.4 0"/></symbol>
        <symbol id="icon-wifi" viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 18 0M6 13a9.5 9.5 0 0 1 12 0M9.5 16.5a4 4 0 0 1 5 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></symbol>
        <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
        <symbol id="icon-maximize" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></symbol>
        <symbol id="icon-restore" viewBox="0 0 24 24"><rect x="7" y="5" width="12" height="12" rx="1"/><path d="M16 17v2H5V8h2"/></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
        <symbol id="icon-device" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
        <symbol id="icon-luma-network" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="6" r="2"/><circle cx="12" cy="21" r="2"/><path d="m6 7 3.5 3M18 7l-3.5 3M12 15v4"/></symbol>
        <symbol id="icon-sync" viewBox="0 0 24 24"><path d="M20 7h-5V2M4 17h5v5M19 12a7 7 0 0 0-12-5L4 10M5 12a7 7 0 0 0 12 5l3-3"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    </svg>

    <main id="session-root" class="session-root" aria-live="polite"></main>

    <main id="luma-desktop" class="desktop" hidden>
        <header class="desktop-brand" aria-label="Luma OS">
            <svg class="icon"><use href="#icon-luma"/></svg>
            <span>Luma OS</span>
        </header>

        <nav class="desktop-shortcuts" aria-label="Raccourcis du bureau">
            <button class="desktop-shortcut" type="button" data-open-app="documents">
                <span class="app-icon app-icon--documents"><svg class="icon"><use href="#icon-folder"/></svg></span>
                <span>Documents</span>
            </button>
            <button class="desktop-shortcut" type="button" data-open-app="trash">
                <span class="app-icon app-icon--trash"><svg class="icon"><use href="#icon-trash"/></svg></span>
                <span>Corbeille</span>
            </button>
        </nav>

        <section id="window-layer" class="window-layer" aria-label="Fenêtres ouvertes"></section>

        <section id="start-panel" class="start-panel" aria-label="Menu Luma" hidden>
            <label class="start-search">
                <svg class="icon"><use href="#icon-search"/></svg>
                <span class="sr-only">Rechercher une application</span>
                <input id="app-search" type="search" placeholder="Rechercher une application">
            </label>
            <div class="start-panel__heading">
                <h2>Applications</h2>
                <span>Votre espace LUMA</span>
            </div>
            <div id="start-apps" class="start-apps"></div>
            <footer class="start-footer">
                <div class="account-chip">
                    <span id="account-avatar" class="account-avatar">L</span>
                    <span><strong id="account-name">Utilisateur Luma</strong><small>Session Kyros</small></span>
                </div>
                <div class="session-actions">
                    <button type="button" data-session-action="lock">Verrouiller</button>
                    <button class="icon-button" type="button" data-session-action="logout" aria-label="Se déconnecter"><svg class="icon"><use href="#icon-power"/></svg></button>
                </div>
            </footer>
        </section>

        <nav class="taskbar" aria-label="Barre des tâches">
            <button id="luma-launcher" class="taskbar-button taskbar-launcher" type="button" aria-label="Ouvrir le menu Luma" aria-expanded="false">
                <svg class="icon"><use href="#icon-luma"/></svg>
            </button>
            <div id="taskbar-apps" class="taskbar-apps" aria-label="Applications ouvertes"></div>
            <div class="taskbar-status">
                <button class="status-button" type="button" aria-label="État du réseau"><svg class="icon"><use href="#icon-wifi"/></svg></button>
                <button id="clock" class="clock" type="button" aria-label="Date et heure"><span></span><small></small></button>
            </div>
        </nav>
    </main>

    <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
    <script type="module" src="./assets/javascripts/luma-shell.js"></script>
</body>
</html>
