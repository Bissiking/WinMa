<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinMa</title>
    <!-- LINK -->
    <link rel="stylesheet" href="./assets/css/allstyles.css">
    <link rel="stylesheet" href="./assets/css/window.css">
    <link rel="icon" type="image/png" href="./images/favicon/logo-luma.png" />
    <!-- SCRIPT LOCAL -->
    <script src="./assets/javascripts/jquery/jquery-3.6.4.js"></script>
    <!-- SCRIPT CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

    <div id="desktop-apps"></div>

    <!-- Windows bottom bar Z-INDEX *100* -->
    <link rel="stylesheet" href="./assets/css/start-menu.css">
    <div class="start-menu hidden" data-locked-session="true">
        <div class="default-block block-start-menu">
            <img id="open-start-button" class="default-block start-button" src="images/menu-btn/menu-btn-01.png">
        </div>
        <div class="default-block apps-start-menu">
            <img id="navigateur-apps-start-menu" class="logo-apps-start-menu" src="./images/interface-logo/apps-menu/LumaNav.png" onclick="openWindow('parametres')">
            <img id="parametres-apps-start-menu" class="logo-apps-start-menu" src="./images/interface-logo/apps-menu/reglage.png">
            <img id="locked-apps-start-menu" class="logo-apps-start-menu locked-session" src="./images/interface-logo/apps-menu/verrouillage.png">
        </div>
        <div class="default-block notifications-horloge-date-start-menu">
            <div class="block-notifications-horloge-date-start-menu">
                <p id="horloge-notifications-horloge-date-start-menu"></p>
                <p id="date-notifications-horloge-date-start-menu"></p>
            </div>
            <img id="notification-logo" src="./images/interface-logo/apps-menu/notification.png">
        </div>
    </div>
    <script src="./assets/javascripts/notifications-horloge-date-start-menu/date-time.js"></script>
    
    <!-- Menu démarré / z-index *99* -->
    <div class="menu-start" data-menu-open="false">
        <div class="menu-start-search-bar">
            <input type="text" placeholder="Rechercher une application">
        </div>
        <div class="menu-start-result-bar">
            <div class="menu-start-result-option">
                <img class="menu-start-ico-user" src="./images/interface-logo/desktop/corbeille.png">
                <p>Corbeille</p>
            </div>
            <div class="menu-start-result-option">
                <img class="menu-start-ico-user" src="./images/interface-logo/desktop/documents.png">
                <p>Documents</p>
            </div>
            <div class="menu-start-result-option">
                <img class="menu-start-ico-user" src="./images/interface-logo/apps-menu/reglage.png">
                <p>Paramètres</p>
            </div>
            <div class="menu-start-result-option">
                <img class="menu-start-ico-user" src="./images/interface-logo/apps-menu/LumaNav.png">
                <p>Navigateur</p>
            </div>
        </div>
        <div class="menu-start-bottom-bar">
            <!-- LOGO PROV -->
            <div class="menu-start-ico-user-name">
                <img class="menu-start-ico-user" src="images/menu-btn/menu-btn-01.png">
                <p id="nameuser-menu-start-ico-user-name">Unknown</p>
            </div>
            
            <div class="menu-start-ico-user-name">
                <div id="menu-menu-start-power-option" class="menu-start-option-system hidden">
                    <p class="locked-session">Verrouiller</p>
                    <p class="locked-session">Changer d'utilisateur</p>
                </div>
                <img id="btn-menu-start-power-option" class="menu-start-power-option" src="images/interface-logo/menu-start/power.png">
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="./assets/javascripts/all.js"></script>
    <script src="./assets/javascripts/window/open-close.js"></script>
    <script src="./assets/javascripts/window/move.js"></script>
</body>

</html>
